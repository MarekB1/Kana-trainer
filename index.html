<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div id="main-card" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center transition-all duration-300 relative flex flex-col max-h-[90vh]">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-4 shrink-0">
            <h1 id="main-title" class="text-2xl font-bold text-gray-800">Hiragana Trainer</h1>
            <button id="btn-chart" onclick="toggleChart()" class="text-sm font-bold bg-purple-100 text-purple-700 px-4 py-2 rounded-lg hover:bg-purple-200 transition-colors">
                📖 Cheat Sheet
            </button>
        </div>

        <!-- Alphabet Toggle -->
        <div class="flex justify-center space-x-2 mb-6 shrink-0 bg-gray-100 p-1 rounded-xl" id="lang-switch">
            <button id="alpha-hiragana" onclick="setAlphabet('hiragana')" class="flex-1 px-4 py-2 rounded-lg text-sm font-bold bg-white text-blue-600 shadow-sm transition-all">Hiragana</button>
            <button id="alpha-katakana" onclick="setAlphabet('katakana')" class="flex-1 px-4 py-2 rounded-lg text-sm font-bold text-gray-500 hover:text-gray-700 transition-all">Katakana</button>
        </div>

        <div id="dynamic-content" class="overflow-y-auto custom-scroll pr-2 grow">
            
            <div id="mode-selector" class="flex justify-center space-x-4 mb-6">
                <button id="mode-h-r" onclick="setMode('h-r')" class="px-4 py-2 rounded-full text-sm font-medium transition-colors bg-blue-600 text-white">Character → Romaji</button>
                <button id="mode-r-h" onclick="setMode('r-h')" class="px-4 py-2 rounded-full text-sm font-medium transition-colors bg-gray-200 text-gray-700">Romaji → Character</button>
            </div>

            <!-- 1. MENU SECTION -->
            <div id="menu-section">
                <h2 class="text-lg font-semibold text-gray-700 mb-4 text-left">Select characters to practice:</h2>
                <div id="checkbox-container" class="space-y-2 mb-6 text-left">
                    <!-- Checkboxes generated by JS -->
                </div>
                <button onclick="startRound()" class="w-full py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl transition-colors text-lg shadow-md">
                    Start Round
                </button>
            </div>

            <!-- 2. QUIZ SECTION -->
            <div id="quiz-section" class="hidden flex flex-col h-full justify-between pb-2">
                <div>
                    <div id="question-display" class="japanese-char font-bold text-blue-600 mb-6 h-32 flex items-center justify-center">
                        <!-- Character -->
                    </div>

                    <div id="input-container" class="hidden">
                        <input type="text" id="romaji-input" class="w-full text-center text-2xl p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none mb-2" autocomplete="off" placeholder="Enter romaji and press Enter" />
                    </div>

                    <div id="options-container" class="flex flex-wrap justify-center gap-2">
                        <!-- Buttons -->
                    </div>

                    <div id="feedback" class="mt-4 h-6 font-semibold"></div>
                </div>

                <div class="mt-8 pt-6 border-t border-gray-100 flex justify-between items-center text-sm text-gray-500">
                    <div>Score: <span id="score" class="font-bold text-gray-800">0</span></div>
                    <div>Total in round: <span id="total" class="font-bold text-gray-800">0</span></div>
                    <button onclick="showMenu()" class="text-red-500 hover:underline font-medium">End Round</button>
                </div>
            </div>

            <!-- 3. SUMMARY SECTION -->
            <div id="summary-section" class="hidden pb-2">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Round Finished!</h2>
                <p class="text-gray-600 mb-6">Your score: <span id="final-score" class="font-bold text-blue-600 text-xl"></span> out of <span id="final-total" class="font-bold text-xl"></span></p>
                
                <div id="mistakes-container" class="mb-6 text-left bg-red-50 p-4 rounded-xl hidden">
                    <h3 class="font-bold text-red-600 mb-2">Your mistakes:</h3>
                    <ul id="mistakes-list" class="space-y-1 text-sm text-gray-700">
                        <!-- Mistakes -->
                    </ul>
                </div>

                <div id="perfect-score" class="mb-6 text-green-600 font-bold text-lg hidden">
                    Perfect score! Great job! 🎉
                </div>

                <button onclick="showMenu()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-colors shadow-md">
                    Back to selection
                </button>
            </div>

            <!-- 4. CHEAT SHEET SECTION -->
            <div id="chart-section" class="hidden text-left pb-4">
                <div id="chart-hiragana-content">
                    <!-- Hiragana chart generated by JS -->
                </div>
                <div id="chart-katakana-content" class="hidden">
                    <!-- Katakana chart generated by JS -->
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
