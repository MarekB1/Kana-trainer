<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nihongo Trainer</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

        <div id="main-card" class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-5xl flex flex-col md:flex-row gap-6 md:gap-8 h-[90vh] max-h-[800px] transition-all duration-300">
            
            <div class="w-full md:w-1/3 flex flex-col shrink-0 border-b md:border-b-0 md:border-r border-gray-200 pb-6 md:pb-0 md:pr-6">
                <h1 id="main-title" class="text-3xl font-bold text-gray-800 mb-8 text-center md:text-left">Hiragana Trainer</h1>
                
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Výber učiva</h3>
                <div id="lang-switch" class="flex flex-col space-y-2 mb-8">
                    <button id="alpha-hiragana" onclick="setAlphabet('hiragana')" class="px-4 py-3 rounded-xl text-left font-bold bg-blue-50 text-blue-700 shadow-sm transition-all border border-blue-200">Hiragana</button>
                    <button id="alpha-katakana" onclick="setAlphabet('katakana')" class="px-4 py-3 rounded-xl text-left font-bold text-gray-500 hover:bg-gray-50 transition-all border border-transparent">Katakana</button>
                    <button id="alpha-vocab" onclick="setAlphabet('vocab')" class="px-4 py-3 rounded-xl text-left font-bold text-gray-500 hover:bg-gray-50 transition-all border border-transparent">Slovíčka</button>
                </div>

                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Režim skúšania</h3>
                <div id="mode-selector" class="flex flex-col space-y-2 mb-6">
                    <button id="mode-h-r" onclick="setMode('h-r')" class="px-4 py-3 rounded-xl font-bold transition-colors bg-blue-600 text-white text-left shadow-sm">Znak → Romaji</button>
                    <button id="mode-r-h" onclick="setMode('r-h')" class="px-4 py-3 rounded-xl font-bold transition-colors bg-gray-100 text-gray-600 hover:bg-gray-200 text-left">Romaji → Znak</button>
                </div>

                <div class="mt-auto pt-4">
                    <button id="btn-chart" onclick="toggleChart()" class="w-full text-sm font-bold bg-purple-100 text-purple-700 px-4 py-3 rounded-xl hover:bg-purple-200 transition-colors shadow-sm">
                        📖 Otvoriť Cheat Sheet
                    </button>
                </div>
            </div>

            <div id="dynamic-content" class="w-full md:w-2/3 flex flex-col overflow-y-auto custom-scroll pr-2 relative">
                
                <div id="menu-section" class="flex flex-col h-full">
                    <div class="flex justify-between items-center mb-6 text-left shrink-0">
                        <h2 class="text-xl font-bold text-gray-800">Vyber si okruhy:</h2>
                        <button onclick="selectAllGroups()" class="text-sm font-bold bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition-colors shadow-sm">
                            Vybrať všetko
                        </button>
                    </div>
                    
                    <div id="lesson-selectors" class="hidden flex gap-2 mb-4 shrink-0">
                        <button onclick="selectLesson('v-l1')" class="flex-1 text-xs font-bold bg-indigo-50 text-indigo-600 px-2 py-2 rounded-lg hover:bg-indigo-100 transition-colors border border-indigo-100 shadow-sm">Všetko L1</button>
                        <button onclick="selectLesson('v-l2')" class="flex-1 text-xs font-bold bg-indigo-50 text-indigo-600 px-2 py-2 rounded-lg hover:bg-indigo-100 transition-colors border border-indigo-100 shadow-sm">Všetko L2</button>
                        <button onclick="selectLesson('v-l3')" class="flex-1 text-xs font-bold bg-indigo-50 text-indigo-600 px-2 py-2 rounded-lg hover:bg-indigo-100 transition-colors border border-indigo-100 shadow-sm">Všetko L3</button>
                    </div>
                
                    <div id="checkbox-container" class="space-y-2 mb-6 text-left grow overflow-y-auto custom-scroll pr-2">
                </div>
                    
                    <button onclick="startRound()" class="w-full py-4 mt-auto bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl transition-colors text-xl shadow-md shrink-0">
                        Spustiť test
                    </button>
                </div>

                <div id="quiz-section" class="hidden flex flex-col h-full justify-center">
                    <div class="flex flex-col items-center justify-center grow">
                        <div id="question-display" class="japanese-char font-bold text-blue-600 mb-8 flex items-center justify-center text-[6rem]">
                            </div>

                        <div id="input-container" class="hidden w-full max-w-sm">
                            <input type="text" id="romaji-input" class="w-full text-center text-3xl p-4 border-2 border-gray-300 rounded-2xl focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all mb-2" autocomplete="off" placeholder="Romaji + Enter" />
                        </div>

                        <div id="options-container" class="flex flex-wrap justify-center gap-3 w-full">
                            </div>

                        <div id="feedback" class="mt-6 text-xl font-bold h-8"></div>
                    </div>

                    <div class="mt-auto pt-6 border-t border-gray-200 flex justify-between items-center text-base text-gray-500 shrink-0">
                        <div>Skóre: <span id="score" class="font-bold text-gray-800 text-lg">0</span></div>
                        <div>Otázky: <span id="total" class="font-bold text-gray-800 text-lg">0</span></div>
                        <button onclick="showMenu()" class="text-red-500 hover:text-red-600 hover:underline font-bold transition-colors">Ukončiť kolo</button>
                    </div>
                </div>

                <div id="summary-section" class="hidden pb-2 flex flex-col items-center justify-center h-full text-center">
                    <h2 class="text-4xl font-bold text-gray-800 mb-4">Kolo ukončené!</h2>
                    <p class="text-gray-600 mb-8 text-lg">Tvoje skóre: <span id="final-score" class="font-bold text-blue-600 text-3xl"></span> z <span id="final-total" class="font-bold text-3xl text-gray-800"></span></p>
                    
                    <div id="mistakes-container" class="mb-8 w-full text-left bg-red-50 p-6 rounded-2xl hidden border border-red-100">
                        <h3 class="font-bold text-red-600 text-xl mb-4">Čo treba dotrénovať:</h3>
                        <ul id="mistakes-list" class="space-y-2 text-base text-gray-700">
                            </ul>
                    </div>

                    <div id="perfect-score" class="mb-8 text-green-600 font-bold text-2xl hidden bg-green-50 p-6 rounded-2xl w-full border border-green-100">
                        Perfektné skóre! Výborná práca! 🎉
                    </div>

                    <button onclick="showMenu()" class="w-full max-w-sm py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-colors shadow-md text-lg">
                        Späť na výber okruhov
                    </button>
                </div>

                <div id="chart-section" class="hidden text-left pb-4">
                    <div id="chart-hiragana-content"></div>
                    <div id="chart-katakana-content" class="hidden"></div>
                    <div id="chart-vocab-content" class="hidden"></div>
                </div>

            </div>
        </div>
        
        <script src="data.js"></script>
        <script src="script.js"></script>
    </body>
</html>
